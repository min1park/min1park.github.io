<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Classic Games · 박민일의 게임 모음</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/games/">
<link rel="canonical" href="https://min1park.github.io/games/">
<script>
  // 예전 루트 서비스워커가 남아 있으면 해제하고 게임 모음으로 이동
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope === location.origin + '/') r.unregister(); }));
  }
  location.replace('/games/' + location.search + location.hash);
</script>
</head>
<body>
<p>게임 모음이 <a href="/games/">min1park.github.io/games</a> 로 이사했습니다.</p>
</body>
</html>
